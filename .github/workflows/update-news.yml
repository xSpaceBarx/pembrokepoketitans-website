name: Update Pokemon GO Hub News

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-pokemon-go-hub-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Axios
        run: npm install --no-save --no-package-lock axios

      - name: Update Pokemon GO Hub news
        run: node scripts/update-news.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/news.json

          if git diff --cached --quiet; then
            echo "No news changes detected. Nothing to commit or push."
            exit 0
          fi

          git commit -m "Automatic Pokémon GO Hub update"

          echo "Checking for newer changes on main..."
          git pull --rebase origin main

          git push origin main
